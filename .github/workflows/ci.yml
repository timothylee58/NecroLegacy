name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_USE_MOCK: "true"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @necrolegacy/web exec tsc --noEmit
      - run: pnpm --filter @necrolegacy/web lint
      - run: pnpm --filter @necrolegacy/web test
      - run: pnpm --filter @necrolegacy/web build
      - run: pnpm --filter @necrolegacy/web exec playwright install --with-deps chromium
      - run: pnpm --filter @necrolegacy/web test:e2e

  api:
    runs-on: ubuntu-latest
    # The test suite uses fakes; the services exist so integration tests can opt in to real backends.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: necrolegacy
        ports: ["5432:5432"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
        working-directory: .
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: lint-imports
      - run: pytest -q
        env:
          NECRO_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/necrolegacy

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @necrolegacy/mcp-server exec tsc --noEmit
      - run: pnpm --filter @necrolegacy/mcp-server test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      - run: scripts/check_contract.sh

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      - run: python scripts/check_manifests.py
      - run: python scripts/check_kiro_ignore.py
      - run: OCR_ENGINE=tesseract python scripts/check_presets.py
      - run: python scripts/check_readme_env.py
        working-directory: .
        env:
          PYTHONPATH: apps/api
      - run: pytest -q scripts/tests
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t necrolegacy-api:latest .
      - run: scripts/check_image_size.sh necrolegacy-api:latest
      - name: Smoke test
        run: |
          # Runs as the image's non-root user with no Redis or Postgres reachable: the pipeline must still finish,
          # which exercises tesseract, OpenCV and the worker processes inside the real container.
          docker run -d --name api -p 8000:8000 \
            -e WEB_ORIGIN=http://localhost:3000 \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e DATABASE_URL=postgresql://u:p@localhost:5432/db \
            necrolegacy-api:latest
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { docker logs api; exit 1; }
          test "$(docker exec api id -u)" != "0"
          for preset in ledger_1994 dotmatrix_manifest; do
            sid=$(curl -fsS -X POST http://localhost:8000/api/sessions/preset \
              -H 'Content-Type: application/json' -d "{\"preset_id\": \"$preset\"}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["session_id"])')
            curl -sN --max-time 120 "http://localhost:8000/api/sessions/$sid/events" > "/tmp/$preset.sse" || true
            if ! grep -q '"type":"terminal".*"status":"completed"' "/tmp/$preset.sse"; then
              echo "preset $preset did not complete"; tail -c 2000 "/tmp/$preset.sse"; docker logs api; exit 1
            fi
          done
