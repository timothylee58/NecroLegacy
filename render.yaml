# Render Blueprint for the web app only. The API runs on Cloud Run (docs/deploy-cloud-run.md).
services:
  - type: web
    runtime: static
    name: necrolegacy-web
    # The build runs at the repo root because pnpm installs the whole workspace from the root lockfile.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @necrolegacy/web build
    staticPublishPath: ./apps/web/out
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
      ignoredPaths:
        - apps/web/**/*.test.ts
        - apps/web/**/*.test.tsx
        - apps/web/tests/**
    envVars:
      # Corepack ships with Node 24; jsdom/undici in the workspace need Node 22.22 or newer.
      - key: NODE_VERSION
        value: "24"
      # The API URL, e.g. https://necrolegacy-api-123456789012.us-central1.run.app. Baked in at build time.
      - key: NEXT_PUBLIC_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
